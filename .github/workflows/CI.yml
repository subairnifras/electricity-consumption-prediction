name: Python CI and Vercel CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: electricity-firefly-webapp

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: electricity-firefly-webapp/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: python -m compileall -q app.py src

      - name: Test Flask homepage
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()
          response = client.get("/")

          assert response.status_code == 200
          assert b"GridAI" in response.data

          print("Flask homepage test passed")
          PY

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Show Flask application location
        run: find . -name "app.py" -print

      - name: Pull Vercel configuration
        run: >
          vercel pull
          --yes
          --environment=production
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: >
          vercel deploy
          --prod
          --yes
          --token=${{ secrets.VERCEL_TOKEN }}